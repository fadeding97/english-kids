/* ---------- player ----------
   用 B站官方嵌入播放器（借鉴 KidsTube）：关弹幕、自动播放；顶部加透明遮挡，避免孩子点标题跳去 B站。
   B站播放器不会告诉网页播放进度，所以由本页自己计时（页面在前台时才计）：
   - 估算播完 → 倒计时自动播下一集（可取消）；
   - 记录看到第几集、第几秒 → 下次接着看；
   - 累计今日观看时长 → 到达家长设定的上限就锁定播放器。 */
const fmtDur = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtMin = s => s >= 3600 ? `${Math.floor(s / 3600)} 小时 ${Math.round(s % 3600 / 60)} 分钟` : `${Math.max(0, Math.ceil(s / 60))} 分钟`;
const loadJSON = (k, d) => { try { return Object.assign(d, JSON.parse(store.get(k) || '{}')); } catch (e) { return d; } };
const saveJSON = (k, v) => store.set(k, JSON.stringify(v));

const settings = loadJSON('settings', { limit: 0, pin: '', autoNext: true, strict: false, kid: false, listen: 'auto' });
const progress = loadJSON('progress', {});   // 资源名 → { ep, t, at }
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function usage() {
  const u = loadJSON('usage', { day: todayKey(), sec: 0, bonus: 0 });
  if (u.day !== todayKey()) { u.day = todayKey(); u.sec = 0; u.bonus = 0; }
  return u;
}
let use = usage();
// 跨天时清零（在内存里累计，定期写入存储）
function rollDay() { if (use.day !== todayKey()) { use = { day: todayKey(), sec: 0, bonus: 0 }; saveJSON('usage', use); } return use; }
const limitSec = () => settings.limit ? settings.limit * 60 + use.bonus : Infinity;
const remaining = () => limitSec() - use.sec;

const player = { item: null, idx: 0, t: 0, dur: 0, tick: 0, countdown: 0, locked: false };
function biliEmbed(e, t) {
  // 手机上 B站会跳到另一个手机版播放器：它只认 p（不认 page）、布尔值只认 true（不认 1），所以两种写法都带上。
  // autoplayMode=unmuted：iPhone 不让有声自动播时，不退回静音播放；loop=true：播放器自己单曲循环（iPhone 实测可用）
  const p = e.page || 1;
  return `https://player.bilibili.com/player.html?bvid=${e.bvid}&page=${p}&p=${p}&autoplay=true&autoplayMode=unmuted${settings.loop ? '&loop=true' : ''}&danmaku=0&danmakuClosed=true&high_quality=1&isOutside=true`;
}
function saveProgress() {
  if (player.item == null) return;
  const it = ITEMS[player.item];
  progress[it.n] = { ep: player.idx, t: Math.floor(player.t), at: Date.now() };
  saveJSON('progress', progress);
}
function stopPlayer() {
  if (player.item != null) saveProgress();
  clearInterval(player.tick); clearInterval(player.countdown);
  player.item = null; player.locked = false;
  const box = $('player'); box.innerHTML = ''; box.classList.remove('pseudo-fs'); document.body.classList.remove('fs-lock');
  placePlayer();
}
const isHere = () => player.item != null && view.mode === 'detail' && view.value === player.item;
/* 播放器放哪里：详情页（正在播的这一条）→ 盖在占位框上，随页面滚动；其他页面 → 移到屏幕外继续播放，底部显示迷你播放条 */
function placePlayer() {
  const box = $('player'), on = player.item != null;
  const wrap = isHere() ? $('stagePlayer') : null, slot = wrap && !wrap.hidden ? $('playerSlot') : null;
  box.hidden = !on;
  box.classList.toggle('docked', !!slot);
  box.classList.toggle('away', on && !slot);
  if (slot && !box.classList.contains('pseudo-fs')) {
    const r = slot.getBoundingClientRect();
    box.style.top = r.top + scrollY + 'px'; box.style.left = r.left + scrollX + 'px';
    box.style.width = r.width + 'px'; box.style.height = r.height + 'px';
  } else { box.style.top = box.style.left = box.style.width = box.style.height = ''; }
  const showMini = on && !slot && !box.classList.contains('pseudo-fs');
  const mini = $('mini'), was = !mini.hidden;
  mini.hidden = !showMini;
  document.body.classList.toggle('has-mini', showMini);
  if (showMini) { syncMini(); if (!was) { mini.classList.remove('in'); void mini.offsetWidth; mini.classList.add('in'); } }
  if (slotObs) { slotObs.disconnect(); if (slot) slotObs.observe(slot); }
  fsBar(box.classList.contains('pseudo-fs'));
}
/* 全屏时把浏览器顶部状态栏那一条染成黑色，和视频的黑底连成一片（iPhone 不允许网页隐藏状态栏；横屏时系统会自动隐藏） */
const themeMeta = document.querySelector('meta[name="theme-color"]'), themeDefault = themeMeta?.content;
function fsBar(on) { if (themeMeta) themeMeta.content = on ? '#000000' : themeDefault; document.documentElement.classList.toggle('fs-dark', on); }
const slotObs = window.ResizeObserver ? new ResizeObserver(() => placePlayer()) : null;
addEventListener('resize', () => placePlayer());
function syncMini() {
  if (player.item == null) return;
  const it = ITEMS[player.item], m = media(it), e = m.episodes[player.idx];
  $('miniArt').innerHTML = m.cover ? `<img src="${esc(coverUrl(m.cover, 96))}" alt="" referrerpolicy="no-referrer">` : '';
  $('miniTitle').textContent = it.cn;
  $('miniSub').textContent = player.locked ? '今天的观看时间到啦' : (player.listen ? '只听声音 · ' : '') + (m.episodes.length > 1 ? `第 ${player.idx + 1} 集 · ${e.title}` : e.title);
  $('miniNext').hidden = player.idx >= m.episodes.length - 1 || player.locked;
  $('miniProg').style.width = player.dur ? Math.min(100, player.t / player.dur * 100) + '%' : '0%';
}
/* 详情页上和播放相关的文字（标题、下一集、选集高亮）只在“正在播的这一条”的详情页更新 */
function syncDock() {
  if (!isHere()) return;
  const m = media(ITEMS[player.item]), e = m.episodes[player.idx];
  $('nowTitle').textContent = m.episodes.length > 1 ? `第 ${player.idx + 1} 集 · ${e.title}` : e.title;
  $('nextBtn').hidden = player.idx >= m.episodes.length - 1;
  document.querySelectorAll('.ep').forEach(b => b.setAttribute('aria-current', String(Number(b.dataset.ep) === player.idx)));
  const b = $('listenBtn');
  $('loopBtn')?.setAttribute('aria-pressed', String(!!settings.loop));
  if (b) { b.setAttribute('aria-pressed', String(!!player.listen)); b.querySelector('span').textContent = player.listen ? '显示画面' : '只听声音'; }
  updateElapsed(); updateQuota();
}

function playItem(id, idx, { resume = false, instant = false } = {}) {
  const it = ITEMS[id], m = media(it);
  if (!m) return;
  const saved = progress[it.n];
  if (idx == null) { idx = saved ? saved.ep : (m.start || 0); resume = true; }
  idx = Math.max(0, Math.min(m.episodes.length - 1, idx));
  const box = $('player');
  const here = view.mode === 'detail' && view.value === id;
  const wrap = here ? $('stagePlayer') : null;
  const first = wrap && wrap.hidden && !instant;
  const e = m.episodes[idx];
  // 续播：B站外嵌播放器无法可靠地从指定秒数开始（未登录时只给试看片段，带起始时间会直接跳到片尾），
  // 所以按“集”续播，并提示上次看到的位置，家长可以拖动进度条。
  const lastPos = resume && saved && saved.ep === idx && saved.t > 15 && (!e.duration || saved.t < e.duration - 20) ? saved.t : 0;
  const startAt = 0;
  const mount = () => {
    if (player.item != null && (player.item !== id || player.idx !== idx)) saveProgress();
    const sameItem = player.item === id;
    clearInterval(player.tick); clearInterval(player.countdown);
    if (wrap) { wrap.hidden = false; document.querySelector('.album')?.classList.add('playing'); }
    player.item = id; player.idx = idx; player.t = startAt; player.dur = e.duration || 0; player.locked = false; player.pulsed = false; player.upShown = false; player.endShown = false; player.touched = false;
    if (!sameItem) player.listen = wantListen(it);
    $('nextBtn')?.classList.remove('pulse');
    syncDock();
    placePlayer();
    saveProgress();
    if (remaining() <= 0) { lockPlayer(); return; }
    const sandbox = settings.strict ? ' sandbox="allow-scripts allow-same-origin allow-presentation allow-storage-access-by-user-activation"' : '';
    box.innerHTML = `<iframe src="${esc(biliEmbed(e, startAt))}" title="${esc(e.title)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin" scrolling="no"${sandbox}></iframe><div class="shield" aria-hidden="true"></div><div class="dm-block" aria-hidden="true"></div>
      <button class="fs-close" type="button" data-fs="1">${ic('i-shrink')}退出全屏</button><span class="fs-rotate">横过手机看，画面更大，状态栏也会隐藏</span>`;
    applyListen();
    if (lastPos) toast(`上次看到 ${fmtDur(lastPos)}，可以拖动进度条接着看`, 4200);
    updateQuota();
    player.tick = setInterval(onTick, 1000);
  };
  if (first) {
    // 第一次播放：专辑封面平滑“变成”播放器
    transition(mount, { dir: 'none', from: $('albumArt'), to: () => box });
    setTimeout(() => wrap.isConnected && wrap.scrollIntoView({ behavior: reduceMotion() ? 'instant' : 'smooth', block: 'start' }), 60);
  } else mount();
}

/* 只听声音：在播放器上盖一张“正在播放”的封面卡片，只露出底部控制条。
   默认规则：18 个月以下的宝宝，儿歌自动只放声音（屏幕时间建议）。家长可在设置里改成“总是/关闭”，播放时也能随时切换。 */
function wantListen(it) {
  if (settings.listen === 'on') return true;
  if (settings.listen === 'off') return false;
  return it.t === 'song' && months < 18;
}
function applyListen() {
  const box = $('player'); if (!box || player.item == null) return;
  box.querySelector('.listen')?.remove();
  syncDock(); if (!$('mini').hidden) syncMini();
  if (!player.listen || player.locked) return;
  const it = ITEMS[player.item], m = media(it), e = m.episodes[player.idx];
  const img = m.cover ? `<img src="${esc(coverUrl(m.cover, 360))}" alt="" referrerpolicy="no-referrer">` : '';
  const el = document.createElement('div');
  el.className = 'listen' + (player.touched || player.everStarted ? ' started' : '') + (player.touched ? ' touched' : '');
  // 封面中心 = 视频画面中心：B站暂停时的 ▶ 按钮就在这里，点封面中间的圆钮 = 点 B站的播放键
  el.innerHTML = `<div class="listen-bg">${img}</div>
    <div class="listen-txt"><span class="listen-label">${ic('i-headphones')}只听声音</span><b>${esc(it.cn)}</b><span>${esc(m.episodes.length > 1 ? e.title : it.n)}</span>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="listen-center">${img ? `<div class="listen-art">${img}</div>` : ''}<span class="listen-play">${ic('i-play')}</span>
      <span class="listen-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="listen-start">点这里开始</span></div>
    <span class="listen-hint">没声音？点封面中间的 ▶</span>
    <div class="listen-block" aria-hidden="true"></div>`;
  const shield = box.querySelector('.shield');
  box.insertBefore(el, shield ? shield.nextSibling : null);
}
/* 单曲循环：参数只能在打开播放器时带上，所以切换后重新载入当前这一首 */
function toggleLoop() {
  settings.loop = !settings.loop; saveJSON('settings', settings);
  syncDock();
  toast(settings.loop ? '单曲循环已打开' : '单曲循环已关闭');
  if (player.item != null && !player.locked) playItem(player.item, player.idx, { instant: true });
}
function toggleListen() { player.listen = !player.listen; applyListen(); }

/* 全屏：优先用浏览器全屏；iPhone 不支持对普通元素全屏，就把播放器铺满屏幕（伪全屏） */
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || !!$('player')?.classList.contains('pseudo-fs'); }
function toggleFs() {
  const box = $('player'); if (!box) return;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  if (box.classList.contains('pseudo-fs')) { box.classList.remove('pseudo-fs'); document.body.classList.remove('fs-lock'); placePlayer(); return; }
  const req = box.requestFullscreen || box.webkitRequestFullscreen;
  const pseudo = () => { box.classList.add('pseudo-fs'); document.body.classList.add('fs-lock'); placePlayer(); };
  if (req) { try { const p = req.call(box); if (p && p.catch) p.catch(pseudo); } catch (e) { pseudo(); } }
  else pseudo();
}

/* 儿童模式：只显示宝宝这个阶段能直接播放的内容，大封面，点了就播；
   不显示搜索、设置和任何跳出本站的链接，退出要输家长密码。 */
function kidHomeView() {
  const ks = stageFor(months);
  const list = ITEMS.filter(i => i.s.includes(ks) && media(i));
  const songs = list.filter(i => i.t !== 'video');
  const videos = months >= 18 ? list.filter(i => i.t === 'video') : [];
  const recent = Object.entries(progress)
    .map(([n, p]) => ({ it: ITEMS.find(i => i.n === n), p }))
    .filter(x => x.it && list.includes(x.it))
    .sort((a, b) => b.p.at - a.p.at).slice(0, 6).map(x => x.it);
  const grid = items => `<div class="kid-grid">${items.map(it => `<button class="tile" type="button" data-id="${it.id}">${art(it, play, 480)}<span class="t-name">${esc(it.cn)}</span></button>`).join('')}</div>`;
  let html = `<header class="kid-h"><div><h1>宝宝的英语时间</h1><p>${months} 个月 · 点图片就能播放</p></div>
    <button class="kid-exit" type="button" data-kid-exit="1">${ic('i-lock')}家长</button></header>`;
  if (recent.length) html += `<section class="sec"><h2 class="sec-h">接着看</h2>${grid(recent)}</section>`;
  if (songs.length) html += `<section class="sec"><h2 class="sec-h">儿歌</h2>${grid(songs)}</section>`;
  if (videos.length) html += `<section class="sec"><h2 class="sec-h">动画</h2>${grid(videos)}</section>`;
  if (months < 18) html += `<p class="kid-note">18 个月前先听儿歌，动画等大一点再看。</p>`;
  return html;
}
async function exitKid() {
  if (!(await askPin('输入家长密码', '退出儿童模式'))) return;
  settings.kid = false; saveJSON('settings', settings);
  toast('已退出儿童模式');
  go({ mode: 'home' });
}

function onTick() {
  if (player.item == null || player.locked || document.visibilityState !== 'visible') return;
  player.t += 1;
  rollDay(); use.sec += 1;
  if (use.sec % 5 === 0) { saveJSON('usage', use); saveProgress(); logUse(use.sec); }
  updateQuota();
  if (remaining() <= 0) { saveJSON('usage', use); return lockPlayer(); }
  const m = media(ITEMS[player.item]);
  const hasNext = player.idx < m.episodes.length - 1;
  updateElapsed();
  if (!$('mini').hidden) $('miniProg').style.width = player.dur ? Math.min(100, player.t / player.dur * 100) + '%' : '0%';
  // 单曲循环：播放器自己从头再播，这里只把页面的计时归零，不弹“下一集”
  if (settings.loop) { if (player.dur && player.t >= player.dur + 1) player.t = 0; return; }
  if (player.dur && hasNext && !player.pulsed && player.t >= player.dur - 8) { player.pulsed = true; if (isHere()) $('nextBtn')?.classList.add('pulse'); }
  if (player.dur && hasNext && settings.autoNext && !player.upShown && !player.endShown && player.t >= player.dur + 1) { player.upShown = true; startCountdown(); }
  else if (player.dur && (!hasNext || !settings.autoNext) && !player.endShown && player.t >= player.dur + 1) { player.endShown = true; showEnd(hasNext); }
}

function updateElapsed() {
  const el = isHere() && $('elapsed'); if (!el) return;
  el.textContent = player.dur ? `${fmtDur(player.t)} / ${fmtDur(player.dur)}` : fmtDur(player.t);
}
function updateQuota() {
  const q = isHere() && $('quota'); if (!q) return;
  if (!settings.limit) { q.hidden = true; return; }
  const r = remaining();
  q.hidden = false;
  q.textContent = `今日还能看 ${fmtMin(r)}`;
  q.classList.toggle('low', r <= 300);
}

/* 快播完时：在播放器上显示“5 秒后播放下一集”，可以取消 */
function startCountdown() {
  const box = $('player'); if (!box || box.querySelector('.up-next')) return;
  const m = media(ITEMS[player.item]), next = m.episodes[player.idx + 1];
  let n = 5;
  const el = document.createElement('div');
  el.className = 'up-next';
  el.innerHTML = `<div class="up-card"><span class="up-label">即将播放</span><b>第 ${player.idx + 2} 集 · ${esc(next.title)}</b>
    <div class="up-actions"><button class="btn btn-accent sm" type="button" data-next="1">立即播放</button><button class="btn btn-glass sm" type="button" data-cancel-next="1">取消</button></div>
    <span class="up-count" id="upCount">${n}</span></div>`;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  player.countdown = setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    n -= 1;
    const c = $('upCount'); if (c) c.textContent = n;
    if (n <= 0) { clearInterval(player.countdown); playItem(player.item, player.idx + 1); }
  }, 1000);
}
/* 播完了（最后一集，或关闭了自动下一集）：盖住 B站结尾的推荐视频 */
function showEnd(hasNext) {
  const box = $('player'); if (!box || box.querySelector('.end-cover')) return;
  const el = document.createElement('div');
  el.className = 'end-cover';
  el.innerHTML = `<div class="end-card"><svg class="ico" aria-hidden="true"><use href="#i-star"/></svg><h3>这一集看完啦</h3>
    <div class="up-actions"><button class="btn btn-glass sm" type="button" data-replay="1">再看一遍</button>${hasNext ? '<button class="btn btn-accent sm" type="button" data-next="1">下一集</button>' : ''}</div></div>`;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
}
function cancelCountdown() {
  clearInterval(player.countdown);
  const el = document.querySelector('.up-next');
  if (el) { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }
  if (player.item != null && player.dur && player.t >= player.dur) { player.endShown = true; setTimeout(() => showEnd(true), 260); }
}

/* 到达每日上限：移除播放器，显示“今天的动画时间到啦” */
function lockPlayer() {
  const box = $('player'); if (!box) return;
  player.locked = true;
  clearInterval(player.countdown);
  saveProgress();
  box.innerHTML = `<div class="lock">
    <svg class="ico lock-ico" aria-hidden="true"><use href="#i-moon"/></svg>
    <h3>今天的动画时间到啦</h3>
    <p>明天再接着看吧。现在可以去听听儿歌、一起读本绘本。</p>
    <button class="btn btn-glass" type="button" data-unlock="1">家长：再看 15 分钟</button>
  </div><button class="fs-close" type="button" data-fs="1">${ic('i-shrink')}退出全屏</button>`;
  updateQuota(); if (!$('mini').hidden) syncMini();
}
async function unlockMore() {
  if (!(await askPin('输入家长密码', '再看 15 分钟'))) return;
  rollDay(); use.bonus += 15 * 60; saveJSON('usage', use);
  toast('已增加 15 分钟');
  if (player.item != null) playItem(player.item, player.idx, { resume: true });
}

/* 浏览器拦截自动播放时，视频停在 0:00，要等用户点一下播放键才开始，而页面计时已经在走。
   第一次点进播放器时（焦点进入 iframe，页面会收到 blur），如果这一集刚开始不久，就把计时从 0 重新算，
   避免“自动下一集”提前出现。 */
window.addEventListener('blur', () => setTimeout(() => {
  const f = document.activeElement;
  if (!f || f.tagName !== 'IFRAME' || !f.closest('#player') || player.item == null || player.touched) return;
  player.touched = true; player.everStarted = true;
  $('player').querySelector('.listen')?.classList.add('started', 'touched');   // 封面中间：▶ 换成声波动画，隐藏“没声音？”提示
  if (player.t <= 90) { player.t = 0; updateElapsed(); }
}, 0));
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  document.querySelectorAll('[data-fs] span').forEach(sp => { sp.textContent = isFs() ? '退出全屏' : '全屏'; });
}));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { saveJSON('usage', use); saveProgress(); }
});
window.addEventListener('pagehide', () => { saveJSON('usage', use); saveProgress(); });

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(msg, ms = 2200) {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* ---------- 家长密码（4 位数字，类似 iPhone 锁屏键盘） ---------- */
async function sha(s) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('english-start:' + s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'h' + hash('english-start:' + s); }
}
function pinPad(title, sub) {
  return new Promise(resolve => {
    const sheet = openSheet(`<div class="pin">
      <h3>${esc(title)}</h3><p class="pin-sub">${esc(sub || '')}</p>
      <div class="pin-dots" id="pinDots">${'<i></i>'.repeat(4)}</div>
      <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}
        <button type="button" data-k="cancel" class="pin-text">取消</button><button type="button" data-k="0">0</button>

}
function renderTopbar() {

let barRaf = 0;

/* ---------- events ---------- */
function setStage(id) {

    stage = id; rememberStage();
    if (view.mode === 'detail' || view.mode === 'search') { navStack = []; view = { mode: 'home' }; }
    render(); toTop();
  });
}
function setMonths(m) {
  m = Math.max(0, Math.min(84, m));
  const s = stageFor(m);
  if (m === months && s === stage) return;
  months = m; store.set('kid-months', String(months));
  if (s === stage) { syncAgeLabels(); return; }   // 同一阶段内只更新文字，不重绘页面
  transition(() => {
    stage = stageFor(months); rememberStage();   // 用最新月龄，避免连续快速修改时停在旧阶段
    if (view.mode === 'detail' || view.mode === 'search') { navStack = []; view = { mode: 'home' }; }
    render(); toTop();
  });
}
const step = d => setMonths(months + d);

/* 月龄滚轮（仿 iOS 选择器）：左边“岁”，右边“个月”；松手吸附，点“完成”或点空白处生效 */
const WH = 36;
function openAgePicker() {

  let done = false;

    const y = Math.round($('wY').scrollTop / WH), mo = Math.round($('wM').scrollTop / WH);
    return Math.min(84, y * 12 + mo);

    <div class="wheels"><div class="wheel-hl" aria-hidden="true"></div>${col('wY', 8, '岁')}${col('wM', 12, '个月')}</div>

    $('ageHint').innerHTML = `<b>${fmtAge(m)}</b> · 推荐 ${st.age}的内容${lv.length ? `，难度从 <b>${lv[0]} ${lvOf(lv[0]).name}</b> 开始` : ''}`;
  };

    w.addEventListener('click', e => { const it = e.target.closest('.w-it'); if (it) w.scrollTo({ top: it.dataset.i * WH, behavior: reduceMotion() ? 'instant' : 'smooth' }); });
    w.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;

  sheet.querySelector('[data-age-done]').addEventListener('click', () => { closeSheet(); });
}
/* 手机上从屏幕左边缘右滑返回（跟手，松手后按速度和距离决定返回还是弹回） */
(function swipeBack() {
  let x0 = 0, y0 = 0, t0 = 0, dx = 0, active = false, locked = false;
  const main = () => $('main');
  document.addEventListener('touchstart', e => {
    if (view.mode !== 'detail' || innerWidth > 760 || reduceMotion()) return;
    const p = e.touches[0];
    if (p.clientX > 28) return;
    x0 = p.clientX; y0 = p.clientY; t0 = performance.now(); dx = 0; active = true; locked = false;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!active) return;
    const p = e.touches[0], mx = p.clientX - x0, my = p.clientY - y0;

      else return;
    }
    dx = Math.max(0, mx);
    main().style.transition = 'none';
    main().style.transform = `translateX(${dx}px)`;
    const pb = $('player'); if (pb.classList.contains('docked')) { pb.style.transition = 'none'; pb.style.translate = `${dx}px 0`; }
  }, { passive: true });
  document.addEventListener('touchend', () => {

    const done = dx > w * .35 || v > .45;

    m.style.transform = done ? `translateX(${w}px)` : 'translateX(0)';

      m.style.transition = ''; m.style.transform = ''; $('player').style.transition = ''; $('player').style.translate = '';
      m.classList.remove('swiping'); document.body.classList.remove('swiping');

// 让 iOS Safari 的 :active 按压态生效
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('click', e => {

    }

  }

  }

  if (t.dataset.ep !== undefined) return playItem(view.value, Number(t.dataset.ep));

  if (t.dataset.listen) return toggleListen();

  if (t.dataset.fs) return toggleFs();

  if (t.dataset.sovClose) return closeSearch();
  if (t.dataset.allEps) { const m = media(ITEMS[view.value]), ol = $('eps'); ol.insertAdjacentHTML('beforeend', m.episodes.slice(ol.children.length).map((e, k) => epLi(e, ol.children.length + k)).join('')); t.remove(); return syncDock(); }
  if (t.dataset.id !== undefined && t.closest('#sov')) { closeSearch(true); return go({ mode: 'detail', value: Number(t.dataset.id) }, { push: true, dir: 'fwd' }); }

  if (t.dataset.id !== undefined) {

document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
/* 手机搜索：iOS 式浮层。点放大镜 → 搜索栏从顶部滑入、键盘立即弹出、内容淡入；结果只在浮层里刷新，不重绘整页 */
function sovResults() {
  const q = $('sovq').value.trim().toLowerCase();
  const items = q ? ITEMS.filter(i => (i.n + i.cn + i.why + i.o).toLowerCase().includes(q)) : [];
  $('sovBody').innerHTML = q
    ? (items.length ? `<p class="sov-h">${items.length} 个结果</p><div class="grid">${items.map(tile).join('')}</div>`
      : `<div class="empty"><h3>没有找到</h3><p>试试 Peppa、佩奇、翻翻书。</p></div>`)
    : `<p class="sov-h">经典推荐</p><div class="grid">${ITEMS.filter(i => i.tg.includes('classic')).map(tile).join('')}</div>`;
}
function openSearch() {
  const o = $('sov'), q = $('sovq');
  if (!o.hidden && !o.classList.contains('out')) return q.focus();
  o.classList.remove('out', 'in'); o.hidden = false;
  q.value = ''; sovResults(); $('sovBody').scrollTop = 0;
  q.focus({ preventScroll: true });   // 必须在点击的同一时刻聚焦，iPhone 才会弹出键盘
  void o.offsetWidth; o.classList.add('in');

}
function closeSearch(instant) {
  const o = $('sov'); if (o.hidden) return;
  $('sovq').blur();

}
let sqt;
$('sovq').addEventListener('input', () => { clearTimeout(sqt); sqt = setTimeout(sovResults, 120); });
$('sovq').addEventListener('keydown', e => { if (e.key === 'Enter') $('sovq').blur(); if (e.key === 'Escape') closeSearch(); });
let qt;
function onSearch(v, fromMobile) {
  query = v.trim();
  clearTimeout(qt);
  qt = setTimeout(() => {
    if (fromMobile) {

    } else { navStack = []; view = query ? { mode: 'search' } : { mode: 'home' }; render(); }

render();
