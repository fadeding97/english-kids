<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 啾啾英语 App 图标：天空蓝底 + 小黄鸡啾啾 + 右上角说 “ABC” 的对话气泡 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CCBFF"/>
      <stop offset="1" stop-color="#BFE7FF"/>
    </linearGradient>
    <radialGradient id="body" cx=".42" cy=".36" r=".7">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- 草地 -->
  <path d="M0 432 Q128 396 256 418 T512 410 V512 H0Z" fill="#9BDB6A"/>
  <g id="fg">
    <!-- 啾啾 -->
    <g transform="translate(228 300) scale(.84)">
      <ellipse cx="0" cy="150" rx="104" ry="14" fill="#000" opacity=".08"/>
      <ellipse cx="-150" cy="40" rx="40" ry="62" transform="rotate(28 -150 40)" fill="#F7BE2A"/>
      <ellipse cx="150" cy="40" rx="40" ry="62" transform="rotate(-28 150 40)" fill="#F7BE2A"/>
      <circle cx="0" cy="0" r="156" fill="url(#body)"/>
      <path d="M-22 -150 q14 -54 34 -10 q12 -36 30 2" fill="none" stroke="#F2A900" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-54" cy="-22" r="21" fill="#3A2A1A"/><circle cx="-47" cy="-30" r="7" fill="#fff"/>
      <circle cx="54" cy="-22" r="21" fill="#3A2A1A"/><circle cx="61" cy="-30" r="7" fill="#fff"/>
      <path d="M-24 12 h48 l-24 32z" fill="#FF8A3D" stroke="#FF8A3D" stroke-width="10" stroke-linejoin="round"/>
      <ellipse cx="-96" cy="24" rx="24" ry="14" fill="#FF8FA0" opacity=".75"/>
      <ellipse cx="96" cy="24" rx="24" ry="14" fill="#FF8FA0" opacity=".75"/>
    </g>
    <!-- ABC 对话气泡：从啾啾右上方冒出来 -->
    <g transform="translate(356 130) rotate(6) scale(.9)">
      <path d="M-92 -50 h184 a34 34 0 0 1 34 34 v40 a34 34 0 0 1 -34 34 h-112 l-34 30 l4 -30 h-42 a34 34 0 0 1 -34 -34 v-40 a34 34 0 0 1 34 -34z" fill="#FFFFFF"/>
      <g font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="78" text-anchor="middle">
        <text x="-66" y="34" fill="#F2675A">A</text>
        <text x="0" y="34" fill="#4C8DF0">B</text>
        <text x="64" y="34" fill="#4CB860">C</text>
      </g>
    </g>
  </g>
</svg>
