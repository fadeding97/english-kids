<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 啾啾英语 App 图标：天空蓝底 + 小黄鸡啾啾（主体放在中间 70% 安全区内，安卓自适应图标裁圆也不会切到） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CCBFF"/>
      <stop offset="1" stop-color="#BFE7FF"/>
    </linearGradient>
    <radialGradient id="body" cx=".42" cy=".36" r=".7">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- 草地 -->
  <path d="M0 420 Q128 380 256 404 T512 396 V512 H0Z" fill="#9BDB6A"/>
  <g transform="translate(256 272)">
    <ellipse cx="0" cy="150" rx="104" ry="14" fill="#000" opacity=".08"/>
    <!-- 翅膀 -->
    <ellipse cx="-150" cy="40" rx="40" ry="62" transform="rotate(28 -150 40)" fill="#F7BE2A"/>
    <ellipse cx="150" cy="40" rx="40" ry="62" transform="rotate(-28 150 40)" fill="#F7BE2A"/>
    <!-- 身体 -->
    <circle cx="0" cy="0" r="156" fill="url(#body)"/>
    <!-- 头顶呆毛 -->
    <path d="M-22 -150 q14 -54 34 -10 q12 -36 30 2" fill="none" stroke="#F2A900" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 眼睛 -->
    <circle cx="-54" cy="-22" r="21" fill="#3A2A1A"/><circle cx="-47" cy="-30" r="7" fill="#fff"/>
    <circle cx="54" cy="-22" r="21" fill="#3A2A1A"/><circle cx="61" cy="-30" r="7" fill="#fff"/>
    <!-- 嘴 -->
    <path d="M-24 12 h48 l-24 32z" fill="#FF8A3D" stroke="#FF8A3D" stroke-width="10" stroke-linejoin="round"/>
    <!-- 腮红 -->
    <ellipse cx="-96" cy="24" rx="24" ry="14" fill="#FF8FA0" opacity=".75"/>
    <ellipse cx="96" cy="24" rx="24" ry="14" fill="#FF8FA0" opacity=".75"/>
  </g>
</svg>
